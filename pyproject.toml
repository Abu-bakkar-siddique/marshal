[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marshal"
version = "0.1.0"
description = "Local-first Linux desktop task manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.scripts]
marshal = "marshal_app.main:main"
marshal-seed-demo = "marshal_app.dev.seed_demo:main"
marshal-test-log = "marshal_app.dev.test_report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
